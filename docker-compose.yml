version: '3.8'

services:
  # The Backend Service (Built from your Dockerfile)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: geniy-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Connect to the 'db' service defined below
      - DATABASE_URL=postgresql://geniy:geniy_password@db:5432/geniy_db?schema=public
      # Pass through API keys from your local machine
      # Create a .env file in the root directory or exporting these vars before running
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - MANUS_API_KEY=${MANUS_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - db
    # We do NOT mount volumes here because we want to test the ACTUAL built image permissions

  # Local Database (Simulating AWS RDS)
  db:
    image: postgres:15-alpine
    container_name: geniy-db
    restart: always
    environment:
      - POSTGRES_USER=geniy
      - POSTGRES_PASSWORD=geniy_password
      - POSTGRES_DB=geniy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
